name: Verify DineFlow
on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dineflow_ci
          POSTGRES_PASSWORD: ci_only_not_a_real_password
          POSTGRES_DB: dineflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dineflow_ci -d dineflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://dineflow_ci:ci_only_not_a_real_password@localhost:5432/dineflow_ci
      BETTER_AUTH_SECRET: ci_only_secret_do_not_use_in_production_1234567890
      BETTER_AUTH_URL: http://localhost:4000
      TRUSTED_ORIGINS: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
      DEV_EMAIL_DELIVERY: console
      DEMO_PASSWORD: CiOnlyStrongPassword_123!DoNotReuse
      DEMO_OWNER_EMAIL: owner-ci@example.test
      DEMO_WAITER_EMAIL: waiter-ci@example.test
      DEMO_KITCHEN_EMAIL: kitchen-ci@example.test
      DEMO_CASHIER_EMAIL: cashier-ci@example.test
      DEMO_PLATFORM_EMAIL: platform-ci@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm ui:verify
      - run: pnpm nav:verify
      - run: pnpm interaction:verify
      - run: pnpm auth:verify
      - run: pnpm dashboard:verify
      - run: pnpm menu20:verify
      - run: pnpm floor21:verify
      - run: pnpm staff22:verify
      - run: pnpm mobile23:verify
      - run: pnpm mobile24:verify
      - run: pnpm mobile25:verify
      - run: pnpm mobile26:verify
      - run: pnpm kitchen27:verify
      - run: pnpm kitchen28:verify
      - run: pnpm kitchen29:verify
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - run: pnpm db:migrate
      - run: pnpm seed:dev
      - name: Boot API and wait for readiness
        shell: bash
        run: |
          pnpm dev:api > /tmp/dineflow-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4000/api/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dineflow-api.log
          exit 1
      - run: pnpm --filter @dineflow/api test:integration
      - run: pnpm --filter @dineflow/api exec tsx src/phase2-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase3-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase4-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase5-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase6-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase9-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase8-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase10-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase11-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase12-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase13-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase14-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase19-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase20-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase21-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase22-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase24-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase25-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase26-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase27-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase28-ci.ts
      - run: pnpm --filter @dineflow/api exec tsx src/phase29-ci.ts
      - name: API logs after failure
        if: failure()
        run: cat /tmp/dineflow-api.log || true
